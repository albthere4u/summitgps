<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1a3a">
<title>Summit GPS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
  :root { --bg:#0b1a3a; --card:#13264f; --line:#26407a; --fg:#eef2ff; --dim:#9fb0d8; --acc:#ffb703; --ok:#3ddc84; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system,system-ui,sans-serif; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px; display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); }
  header b { font-size:17px; }
  #clock { font-variant-numeric:tabular-nums; font-size:20px; font-weight:700; }
  #clock small { color:var(--dim); font-weight:400; font-size:12px; margin-left:6px; }
  main { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; min-height:0; }
  .panel { display:none; height:100%; }
  .panel.on { display:block; }
  #now { padding:12px 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .card.live { border-color:var(--acc); }
  .tag { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
  .live .tag { color:var(--acc); }
  .time { font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px; }
  .title { font-weight:700; margin:2px 0; }
  .sub { color:var(--dim); font-size:12px; }
  .place { margin-top:6px; font-size:14px; }
  .fl { display:inline-block; background:var(--line); color:var(--fg); font-size:11px; font-weight:700; padding:1px 6px; border-radius:5px; margin-left:6px; vertical-align:1px; }
  .fl.f1 { background:#5b2d8a; } .fl.fL { background:#1f6f8b; } .fl.fout { background:#3a5a2a; }
  .go { display:inline-block; margin-top:8px; background:var(--acc); color:#1a1200; font-weight:700; border:0; border-radius:8px; padding:8px 14px; font-size:14px; }
  .go.off { background:var(--line); color:var(--dim); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .until { margin-left:auto; color:var(--dim); font-size:12px; }
  /* guide map */
  #guide { display:none; flex-direction:column; height:100%; }
  #guide.on { display:flex; }
  #svgwrap { flex:1; min-height:0; position:relative; background:#0e1f47; }
  #svgwrap svg { width:100%; height:100%; display:block; touch-action:none; }
  #gpsbtn, #compassbtn { position:absolute; top:8px; z-index:5; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-size:12px; }
  #gpsbtn { right:8px; } #compassbtn { left:8px; }
  #hud { flex:none; background:var(--card); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)/2); }
  #hud .top { display:flex; align-items:center; gap:12px; }
  #arrow { width:48px; height:48px; flex:none; display:grid; place-items:center; border-radius:50%; background:var(--bg); font-size:30px; transition:transform .2s; }
  #hud .t { flex:1; min-width:0; }
  #hud .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #hud .t span { color:var(--dim); font-size:12px; }
  #dist { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  #steps { margin-top:8px; font-size:12px; color:var(--dim); line-height:1.5; }
  #steps b { color:var(--fg); }
  /* svg styles */
  .sea { fill:#1a4f8a; } .sea-t { fill:#8fc2ff; font-size:7px; }
  .bldg { fill:#2a3f75; stroke:#4a63a8; stroke-width:1; rx:3; } .bldg1 { fill:#3b2a5c; stroke:#7a56b0; stroke-width:1; rx:3; }
  .pool { fill:#2b6fb0; stroke:#6fb0ff; stroke-width:1; rx:12; } .lawn { fill:#2c5a35; stroke:#5c9a55; stroke-width:1; rx:6; }
  .blk-t { fill:#c9d4f5; font-size:6px; font-weight:600; }
  .edge { stroke:#6b7fb3; stroke-width:1.2; stroke-dasharray:2 2; fill:none; }
  .route { stroke:var(--acc); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none; }
  .node { fill:#ffb703; stroke:#1a1200; stroke-width:.8; } .node.tgt { fill:var(--bad); stroke:#fff; stroke-width:1.2; }
  .node.via { fill:#9fb0d8; }
  .lbl { fill:#eef2ff; font-size:5.5px; paint-order:stroke; stroke:#0b1a3a; stroke-width:1.5px; stroke-linejoin:round; }
  .lbl.tgt { font-size:6.5px; font-weight:700; fill:#ffd6d6; }
  .me { fill:#2f80ff; stroke:#fff; stroke-width:1.5; } .meacc { fill:#2f80ff22; stroke:#2f80ff; stroke-width:.5; }
  .meh { fill:#2f80ff; }
  .rose { fill:#9fb0d8; font-size:6px; }
  /* schedule */
  #sched { padding:12px 14px; }
  .days { display:flex; gap:6px; margin-bottom:10px; }
  .days button { flex:1; background:var(--card); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; }
  .days button.on { color:var(--fg); border-color:var(--acc); }
  .item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .item.past { opacity:.45; }
  .item.live { border-left:3px solid var(--acc); padding-left:8px; }
  .item .time { width:84px; flex:none; }
  nav { display:flex; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); background:var(--bg); }
  nav button { flex:1; background:none; border:0; color:var(--dim); padding:10px 0 8px; font-size:12px; }
  nav button.on { color:var(--acc); }
  nav button i { display:block; font-style:normal; font-size:20px; }
  details { margin:10px 14px; color:var(--dim); font-size:12px; } details img { width:100%; margin-top:6px; border-radius:8px; }
</style>
</head>
<body>
<div id="app">
  <header><b>Snapdragon Summit 2026</b><div id="clock">--:--<small>HST</small></div></header>
  <main>
    <section id="now" class="panel on"></section>
    <section id="guide" class="panel">
      <div id="svgwrap">
        <button id="compassbtn">🧭 나침반</button>
        <button id="gpsbtn">📡 GPS</button>
        <svg id="svg" viewBox="-25 -35 300 345" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="hud">
        <div class="top"><div id="arrow">➤</div><div class="t"><b id="hud-name">목적지를 선택하세요</b><span id="hud-sub">지도의 핀을 누르거나 “지금” 탭에서 선택</span></div><div id="dist">—</div></div>
        <div id="steps"></div>
      </div>
    </section>
    <section id="sched" class="panel"></section>
  </main>
  <nav>
    <button data-p="now" class="on"><i>⏱</i>지금</button>
    <button data-p="guide"><i>🗺</i>안내도</button>
    <button data-p="sched"><i>📋</i>일정</button>
  </nav>
</div>
<script src="venues.js"></script>
<script>
const TZ = 'Pacific/Honolulu';
const $ = s => document.querySelector(s);
const N = window.NODES, E = window.EDGES, S = window.SCHEDULE, B = window.BLOCKS;
const FLOOR = { L:'L층 (로비)', '1':'1층 (로비 아래)', out:'실외' };
const fl = f => `<span class="fl f${f}">${FLOOR[f]}</span>`;

// ---------- 좌표계: 미터. x=북(+), y=동/내륙(+). 바다가 위, Lahaina Tower가 왼쪽 ----------
const ORIGIN = { lat:20.9117, lng:-156.6937 };
const M_LAT = 111320, M_LNG = 111320*Math.cos(ORIGIN.lat*Math.PI/180);
const toXY = p => ({ x:(p.lat-ORIGIN.lat)*M_LAT, y:(p.lng-ORIGIN.lng)*M_LNG });
const distM = (a,b) => { const A=toXY(a), C=toXY(b); return Math.hypot(A.x-C.x, A.y-C.y); };
const bearing = (a,b) => { const A=toXY(a), C=toXY(b); return (Math.atan2(C.y-A.y, C.x-A.x)*180/Math.PI+360)%360; }; // 0=북, 90=동
const dirName = b => ['북','북동','동','남동','남','남서','서','북서'][Math.round(b/45)%8];

// ---------- time (HST) ----------
function hstNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const h = +p.hour%24;
  return { date:`${p.year}-${p.month}-${p.day}`, min:h*60+ +p.minute, hhmm:`${String(h).padStart(2,'0')}:${p.minute}` };
}
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const untilTxt = d => d<60 ? `${d}분` : `${Math.floor(d/60)}시간 ${d%60}분`;
const q = new URLSearchParams(location.search);   // 개발용 ?day=1&t=08:30
function nowState() { const n=hstNow(); if (q.get('day')) n.date=S[+q.get('day')-1].date; if (q.get('t')) { n.min=toMin(q.get('t')); n.hhmm=q.get('t'); } return n; }

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showPanel(b.dataset.p));
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id===id));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.p===id));
  if (id==='guide') { if (!watchId) startGps(); if (!target) { const a = autoTarget(); if (a) goTo(a); } }
}
function autoTarget() {
  const n = nowState(), day = S.find(d=>d.date===n.date); if (!day) return null;
  const live = day.items.find(i => i.v && toMin(i.s)<=n.min && n.min<toMin(i.e));
  const next = day.items.filter(i => i.v && toMin(i.s)>n.min).sort((a,b)=>toMin(a.s)-toMin(b.s))[0];
  // 진행 중 세션이 끝나기 15분 전부터는 다음 세션으로
  if (live && !(next && toMin(live.e)-n.min<=15)) return live.v;
  return next ? next.v : (live ? live.v : null);
}

// ---------- NOW ----------
let selectedDay = null;
function renderNow() {
  const n = nowState(), day = S.find(d=>d.date===n.date), el = $('#now');
  let html = `<div class="sub" style="margin-bottom:8px">${n.date} · ${day?day.day:'행사 기간 외'}</div>`;
  if (!day) { el.innerHTML = html + `<div class="card"><div class="title">행사 기간이 아닙니다</div><div class="sub">9/22–9/24 HST</div></div>`; return; }
  const live = day.items.filter(i => toMin(i.s)<=n.min && n.min<toMin(i.e));
  const next = day.items.filter(i => toMin(i.s)>n.min).sort((a,b)=>toMin(a.s)-toMin(b.s));
  const ns = next.length ? toMin(next[0].s) : null;
  live.forEach(i => html += card(i,'live',`진행 중 · ${untilTxt(toMin(i.e)-n.min)} 남음`));
  next.filter(i=>toMin(i.s)===ns).forEach(i => html += card(i,'next',`다음 · ${untilTxt(toMin(i.s)-n.min)} 후 시작`));
  next.filter(i=>toMin(i.s)!==ns).slice(0,3).forEach(i => html += card(i,'later',`${untilTxt(toMin(i.s)-n.min)} 후`));
  if (!live.length && !next.length) html += `<div class="card"><div class="title">오늘 일정 종료 🌙</div></div>`;
  el.innerHTML = html;
}
function card(i, kind, until) {
  const v = i.v ? N[i.v] : null;
  const tag = kind==='live'?'진행 중':kind==='next'?'다음 일정':'이후';
  return `<div class="card ${kind==='live'?'live':''}">
    <div class="row"><div class="tag">${tag}</div><div class="until">${until}</div></div>
    <div class="time">${i.s} – ${i.e}</div><div class="title">${i.t}</div>${i.sub?`<div class="sub">${i.sub}</div>`:''}
    <div class="place">📍 ${v?v.name:i.place}${i.room?` · ${i.room}`:''}${v?fl(v.floor):''}</div>
    ${v?distLine(i.v):''}
    ${v?`<button class="go" onclick="goTo('${i.v}')">여기로 가기 →</button>`:`<button class="go off" disabled>리조트 밖 · 안내 없음</button>`}</div>`;
}

function distLine(k) {
  if (!pos) return `<div class="sub">📡 위치 확인 중…</div>`;
  const r = routeTo(k);
  if (r.total < 20) return `<div class="sub" style="color:var(--ok)">✅ 바로 여기 (${Math.round(r.total)}m)</div>`;
  return `<div class="sub">🚶 현재 위치에서 <b style="color:var(--fg)">${Math.round(r.total)}m</b> · 도보 약 ${Math.max(1,Math.round(r.total/60))}분${r.stairs?' · 계단 포함':''}</div>`;
}

// ---------- schedule ----------
function renderSched() {
  const n = nowState(), di = selectedDay ?? Math.max(0, S.findIndex(d=>d.date===n.date)), day = S[di];
  let html = `<div class="days">${S.map((d,k)=>`<button class="${k===di?'on':''}" onclick="selectedDay=${k};renderSched()">${d.day}</button>`).join('')}</div>`;
  day.items.forEach(i => {
    const today = day.date===n.date, sm=toMin(i.s), em=toMin(i.e);
    const cls = today ? (n.min>=em?'past':(n.min>=sm?'live':'')) : '';
    const v = i.v ? N[i.v] : null;
    html += `<div class="item ${cls}"><div class="time">${i.s}<br>${i.e}</div><div style="flex:1"><div class="title">${i.t}</div>${i.sub?`<div class="sub">${i.sub}</div>`:''}
      <div class="sub">📍 ${v?v.name:i.place}${i.room?` · ${i.room}`:''}${v?fl(v.floor):''}</div>
      ${v?`<button class="go" style="padding:5px 10px;font-size:12px" onclick="goTo('${i.v}')">여기로 가기 →</button>`:''}</div></div>`;
  });
  html += `<details><summary>원본 리조트 안내도 보기</summary><img src="assets/resort-map.png" alt="리조트 안내도"></details>`;
  $('#sched').innerHTML = html;
}

// ---------- graph ----------
const adj = {};
for (const [a,b,opt] of E) {
  const w = distM(N[a],N[b]) + (opt?.stairs?40:0);
  (adj[a] ||= []).push({ to:b, w, opt }); (adj[b] ||= []).push({ to:a, w, opt });
}
function dijkstra(src, dst) {
  const d = {}, prev = {}, seen = new Set(); Object.keys(N).forEach(k=>d[k]=Infinity); d[src]=0;
  while (true) {
    let u=null; for (const k in d) if (!seen.has(k) && (u===null || d[k]<d[u])) u=k;
    if (u===null || d[u]===Infinity) break; if (u===dst) break; seen.add(u);
    for (const e of adj[u]||[]) if (d[u]+e.w < d[e.to]) { d[e.to]=d[u]+e.w; prev[e.to]={from:u,opt:e.opt}; }
  }
  if (d[dst]===Infinity) return null;
  const path=[]; for (let k=dst; k; k=prev[k]?.from) { path.unshift({k, opt:prev[k]?.opt}); if (k===src) break; }
  return { path, len:d[dst] };
}
function routeTo(k) {
  const near = nearestNode(pos), r = dijkstra(near.k, k), straight = distM(pos, N[k]);
  if (!r) return { total:straight, path:[], first:N[k], stairs:false };
  const stairs = r.path.some(s=>s.opt?.stairs);
  const total = Math.min(straight, near.d + r.len - (stairs?40:0));
  const first = r.path.length>1 && near.d<8 ? N[r.path[1].k] : N[r.path[0].k];
  return { total, path:r.path, first, stairs, near };
}
function nearestNode(p) {
  let best=null, bd=Infinity;
  for (const k in N) { const dd=distM(p,N[k]); if (dd<bd) { bd=dd; best=k; } }
  return { k:best, d:bd };
}

// ---------- SVG map ----------
const svg = $('#svg'), NS='http://www.w3.org/2000/svg';
const el = (t, a, txt) => { const e=document.createElementNS(NS,t); for (const k in a) e.setAttribute(k,a[k]); if (txt!=null) e.textContent=txt; return e; };
const P = {}; for (const k in N) P[k]=toXY(N[k]);
// blocks
for (const b of B) {
  const g = el('g',{});
  g.appendChild(el('rect',{ class:b.kind, x:b.x, y:b.y, width:b.w, height:b.h }));
  g.appendChild(el('text',{ class:b.kind==='sea'?'sea-t':'blk-t', x:b.x+3, y:b.y+(b.kind==='sea'?b.h-4:8) }, b.label));
  svg.appendChild(g);
}
// compass
svg.appendChild(el('text',{class:'rose',x:230,y:-22},'N →'));
svg.appendChild(el('text',{class:'rose',x:-20,y:-22},'▲ 바다 / 서'));
// edges
for (const [a,b] of E) svg.appendChild(el('line',{ class:'edge', x1:P[a].x, y1:P[a].y, x2:P[b].x, y2:P[b].y }));
const routeEl = el('polyline',{ class:'route', points:'' }); svg.appendChild(routeEl);
// nodes + labels (겹치는 라벨은 오프셋)
const OFF = { mediaLounge:[-34,-4], monarchy14:[4,-9], monarchy57:[4,10], sunsetTerrace:[4,3], lahElev:[4,-4], lahaina12:[-4,-8], lahaina34:[-14,11], halonaKai:[4,-6], recCenter:[4,-4], jacuzzi:[-14,-6], napiliElev:[4,-6], smoking:[4,3] };
const nodeEls = {};
for (const k in N) {
  if (!N[k].venue) continue;
  const g = el('g',{ 'data-k':k }); g.style.cursor='pointer';
  g.appendChild(el('circle',{ class:'node', cx:P[k].x, cy:P[k].y, r:3 }));
  const o = OFF[k] ?? [4,2];
  g.appendChild(el('text',{ class:'lbl', x:P[k].x+o[0], y:P[k].y+o[1]+2 }, N[k].name));
  g.onclick = () => goTo(k); svg.appendChild(g); nodeEls[k]=g;
}
const meAcc = el('circle',{ class:'meacc', r:0, cx:-999, cy:-999 }), meDot = el('circle',{ class:'me', r:3.5, cx:-999, cy:-999 }), meHead = el('path',{ class:'meh', d:'M0,-9 L4,-2 L-4,-2 Z', visibility:'hidden' });
svg.appendChild(meAcc); svg.appendChild(meDot); svg.appendChild(meHead);

// ---------- GPS ----------
let pos=null, heading=null, target=null, watchId=null;
function startGps() {
  if (!navigator.geolocation) { $('#gpsbtn').textContent='GPS 미지원'; return; }
  $('#gpsbtn').textContent='📡 검색 중…';
  watchId = navigator.geolocation.watchPosition(p => {
    pos = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy };
    if (p.coords.heading!=null && p.coords.speed>0.5) heading=p.coords.heading;
    const xy = toXY(pos), inside = xy.x>-25&&xy.x<275&&xy.y>-35&&xy.y<310;
    const cx = Math.max(-22, Math.min(272, xy.x)), cy = Math.max(-32, Math.min(307, xy.y));
    meDot.setAttribute('cx',cx); meDot.setAttribute('cy',cy);
    meAcc.setAttribute('cx',cx); meAcc.setAttribute('cy',cy); meAcc.setAttribute('r', Math.min(pos.acc, 60));
    $('#gpsbtn').textContent = `📡 ±${Math.round(pos.acc)}m${inside?'':' · 범위 밖'}`;
    update(); if ($('#now').classList.contains('on')) renderNow();
  }, e => { $('#gpsbtn').textContent='📡 '+(e.code===1?'권한 거부':'오류'); }, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
}
$('#gpsbtn').onclick = () => { if (!pos) startGps(); };
$('#compassbtn').onclick = async () => {
  try {
    if (typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission) { if (await DeviceOrientationEvent.requestPermission()!=='granted') throw 0; }
    window.addEventListener('deviceorientationabsolute', onOrient, true); window.addEventListener('deviceorientation', onOrient, true);
    $('#compassbtn').textContent='🧭 켜짐';
  } catch { $('#compassbtn').textContent='🧭 권한 없음'; }
};
function onOrient(e) {
  let h=null; if (e.webkitCompassHeading!=null) h=e.webkitCompassHeading; else if (e.absolute && e.alpha!=null) h=(360-e.alpha)%360;
  if (h!=null) { heading=h; update(); }
}

// ---------- navigate ----------
function goTo(k) {
  target=k; showPanel('guide');
  for (const kk in nodeEls) { nodeEls[kk].querySelector('circle').classList.toggle('tgt', kk===k); nodeEls[kk].querySelector('text').classList.toggle('tgt', kk===k); }
  update();
}
function update() {
  // heading marker on map (지도 좌표계: 0°=북=오른쪽 → 화면 회전 = heading+90)
  if (pos && heading!=null) { meHead.setAttribute('visibility','visible'); meHead.setAttribute('transform',`translate(${meDot.getAttribute('cx')},${meDot.getAttribute('cy')}) rotate(${heading+90})`); }
  if (!target) return;
  const v = N[target];
  $('#hud-name').innerHTML = v.name + fl(v.floor);
  if (!pos) { $('#hud-sub').textContent='GPS 위치 찾는 중…'; $('#dist').textContent='—'; $('#steps').textContent=''; routeEl.setAttribute('points',''); return; }
  const r = routeTo(target), straight = distM(pos, v);
  if (straight < 20) {
    routeEl.setAttribute('points',''); $('#dist').textContent=`${Math.round(straight)}m`;
    $('#hud-sub').textContent = `도착 · ${v.note||''}`; $('#steps').innerHTML = `✅ 목적지 근처입니다. ${fl(v.floor)} 확인`; setArrow(bearing(pos,v)); return;
  }
  const pts = [toXY(pos), ...r.path.map(s=>P[s.k])];
  routeEl.setAttribute('points', pts.map(p=>`${p.x},${p.y}`).join(' '));
  const b = bearing(pos, r.first);
  $('#dist').textContent = `${Math.round(r.total)}m`;
  $('#hud-sub').textContent = `${dirName(b)}쪽으로 · 도보 약 ${Math.max(1,Math.round(r.total/60))}분 · ${v.note||''}`;
  const steps = r.path.map((s,i) => (s.opt?.stairs?`<b>↕ ${s.opt.msg}</b> → `:'') + (i===r.path.length-1?`<b>${N[s.k].name}</b>`:N[s.k].name)).join(' → ');
  $('#steps').innerHTML = steps;
  setArrow(b);
}
function setArrow(b) {
  const rel = heading!=null ? b-heading : b;
  $('#arrow').style.transform = `rotate(${rel-90}deg)`;
  $('#arrow').style.color = heading!=null ? 'var(--ok)' : 'var(--dim)';
}

// ---------- boot ----------
function tick() { $('#clock').firstChild.nodeValue = nowState().hhmm; }
tick(); renderNow(); renderSched(); startGps();
setInterval(()=>{ tick(); renderNow(); if ($('#sched').classList.contains('on')) renderSched(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
