<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1a3a">
<title>Summit GPS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0b1a3a; --card:#13264f; --line:#26407a; --fg:#eef2ff; --dim:#9fb0d8; --acc:#ffb703; --ok:#3ddc84; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system,system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px; display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); }
  header b { font-size:17px; }
  #clock { font-variant-numeric:tabular-nums; font-size:20px; font-weight:700; }
  #clock small { color:var(--dim); font-weight:400; font-size:12px; margin-left:6px; }
  main { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
  .panel { display:none; height:100%; }
  .panel.on { display:block; }
  #now { padding:12px 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .card.live { border-color:var(--acc); }
  .tag { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
  .live .tag { color:var(--acc); }
  .time { font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px; }
  .title { font-weight:700; margin:2px 0; }
  .sub { color:var(--dim); font-size:12px; }
  .place { margin-top:6px; font-size:14px; }
  .place .est { color:var(--acc); font-size:11px; margin-left:4px; }
  .go { display:inline-block; margin-top:8px; background:var(--acc); color:#1a1200; font-weight:700; border:0; border-radius:8px; padding:8px 14px; font-size:14px; }
  .go.off { background:var(--line); color:var(--dim); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .until { margin-left:auto; color:var(--dim); font-size:12px; }
  /* map */
  #mapwrap { position:relative; height:100%; }
  #map { height:100%; background:#000; }
  #hud { position:absolute; left:10px; right:10px; bottom:10px; z-index:900; background:rgba(11,26,58,.92); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:12px; }
  #arrow { width:48px; height:48px; flex:none; display:grid; place-items:center; border-radius:50%; background:var(--card); font-size:30px; transition:transform .2s; }
  #hud .t { flex:1; min-width:0; }
  #hud .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #hud .t span { color:var(--dim); font-size:12px; }
  #dist { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  #gpsbtn { position:absolute; right:10px; top:10px; z-index:900; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; }
  #compassbtn { position:absolute; left:10px; top:10px; z-index:900; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; }
  .me { width:18px; height:18px; border-radius:50%; background:#2f80ff; border:3px solid #fff; box-shadow:0 0 0 2px #2f80ff88; }
  .pin { background:var(--acc); color:#1a1200; font-weight:700; font-size:11px; padding:3px 6px; border-radius:6px; white-space:nowrap; border:1px solid #0006; }
  .pin.target { background:var(--bad); color:#fff; }
  /* illustrated map */
  #guide { height:100%; overflow:auto; }
  #guidebox { position:relative; width:2126px; height:1104px; transform-origin:0 0; }
  #guidebox img { width:100%; height:100%; display:block; }
  .gpin { position:absolute; transform:translate(-50%,-100%); background:var(--acc); color:#1a1200; font-weight:700; font-size:20px; padding:6px 10px; border-radius:8px; border:2px solid #0008; white-space:nowrap; }
  .gpin.target { background:var(--bad); color:#fff; }
  .gpin::after { content:''; position:absolute; left:50%; top:100%; transform:translateX(-50%); border:8px solid transparent; border-top-color:#0008; }
  /* schedule */
  #sched { padding:12px 14px; }
  .days { display:flex; gap:6px; margin-bottom:10px; }
  .days button { flex:1; background:var(--card); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; }
  .days button.on { color:var(--fg); border-color:var(--acc); }
  .item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .item.past { opacity:.45; }
  .item.live { border-left:3px solid var(--acc); padding-left:8px; }
  .item .time { width:84px; flex:none; }
  nav { display:flex; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); background:var(--bg); }
  nav button { flex:1; background:none; border:0; color:var(--dim); padding:10px 0 8px; font-size:12px; }
  nav button.on { color:var(--acc); }
  nav button i { display:block; font-style:normal; font-size:20px; }
  .warn { background:#3a2a0b; border:1px solid #7a5a1a; color:#ffd58a; border-radius:10px; padding:8px 12px; font-size:12px; margin-bottom:10px; }
</style>
</head>
<body>
<div id="app">
  <header><b>Snapdragon Summit 2026</b><div id="clock">--:--<small>HST</small></div></header>
  <main>
    <section id="now" class="panel on"></section>
    <section id="mapwrap" class="panel">
      <div id="map"></div>
      <button id="compassbtn">🧭 나침반</button>
      <button id="gpsbtn">📡 GPS</button>
      <div id="hud"><div id="arrow">➤</div><div class="t"><b id="hud-name">목적지를 선택하세요</b><span id="hud-sub">지금 탭에서 “여기로 가기”</span></div><div id="dist">—</div></div>
    </section>
    <section id="guide" class="panel"><div id="guidebox"><img src="assets/resort-map.png" alt="리조트 안내도"></div></section>
    <section id="sched" class="panel"></section>
  </main>
  <nav>
    <button data-p="now" class="on"><i>⏱</i>지금</button>
    <button data-p="mapwrap"><i>🛰</i>지도</button>
    <button data-p="guide"><i>🗺</i>안내도</button>
    <button data-p="sched"><i>📋</i>일정</button>
  </nav>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="venues.js"></script>
<script>
const TZ = 'Pacific/Honolulu';
const $ = s => document.querySelector(s);
const V = window.VENUES, S = window.SCHEDULE;

// ---------- time (HST) ----------
function hstNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {timeZone:TZ, hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { date:`${p.year}-${p.month}-${p.day}`, min:+p.hour%24*60 + +p.minute, hhmm:`${p.hour%24===p.hour?p.hour:'00'}:${p.minute}` };
}
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const fmt = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const untilTxt = d => d<60 ? `${d}분` : `${Math.floor(d/60)}시간 ${d%60}분`;

// 개발용: ?day=1&t=08:30 로 시각 강제
const q = new URLSearchParams(location.search);
function nowState() {
  const n = hstNow();
  if (q.get('day')) { n.date = S[+q.get('day')-1].date; }
  if (q.get('t')) { n.min = toMin(q.get('t')); n.hhmm = q.get('t'); }
  return n;
}

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showPanel(b.dataset.p));
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id===id));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.p===id));
  if (id==='mapwrap') { setTimeout(()=>map.invalidateSize(),50); if (!watchId) startGps(); }
  if (id==='guide') fitGuide();
}

// ---------- NOW panel ----------
let selectedDay = null;
function renderNow() {
  const n = nowState();
  const day = S.find(d => d.date===n.date);
  const el = $('#now');
  let html = `<div class="sub" style="margin-bottom:8px">${n.date} · ${day ? day.day : '행사 기간 외'}</div>`;
  if (!day) { el.innerHTML = html + `<div class="card"><div class="title">행사 기간이 아닙니다</div><div class="sub">9/22–9/24 HST. 테스트: <code>?day=1&t=08:30</code></div></div>`; return; }
  const live = day.items.filter(i => toMin(i.s)<=n.min && n.min<toMin(i.e));
  const next = day.items.filter(i => toMin(i.s)>n.min).sort((a,b)=>toMin(a.s)-toMin(b.s));
  const nextStart = next.length ? toMin(next[0].s) : null;
  const upcoming = next.filter(i => toMin(i.s)===nextStart);
  const later = next.filter(i => toMin(i.s)!==nextStart).slice(0,3);
  if (Object.values(V).some(v=>v.estimated)) html += `<div class="warn">⚠ 일부 장소 좌표가 추정값입니다 (장소명 옆 ★). 현장 좌표 반영 전까지 오차가 있을 수 있습니다.</div>`;
  live.forEach(i => html += card(i, 'live', `진행 중 · ${untilTxt(toMin(i.e)-n.min)} 남음`));
  upcoming.forEach(i => html += card(i, 'next', `다음 · ${untilTxt(toMin(i.s)-n.min)} 후 시작`));
  later.forEach(i => html += card(i, 'later', `${untilTxt(toMin(i.s)-n.min)} 후`));
  if (!live.length && !next.length) html += `<div class="card"><div class="title">오늘 일정 종료 🌙</div></div>`;
  el.innerHTML = html;
}
function card(i, kind, until) {
  const v = i.v ? V[i.v] : null;
  const tag = kind==='live' ? '진행 중' : kind==='next' ? '다음 일정' : '이후';
  return `<div class="card ${kind==='live'?'live':''}">
    <div class="row"><div class="tag">${tag}</div><div class="until">${until}</div></div>
    <div class="time">${i.s} – ${i.e}</div>
    <div class="title">${i.t}</div>${i.sub?`<div class="sub">${i.sub}</div>`:''}
    <div class="place">📍 ${v ? v.name : i.place}${i.room?` · ${i.room}`:''}${v&&v.estimated?'<span class="est">★</span>':''}</div>
    ${v ? `<button class="go" onclick="goTo('${i.v}')">여기로 가기 →</button>` : `<button class="go off" disabled>리조트 밖 · 지도 안내 없음</button>`}
  </div>`;
}

// ---------- schedule panel ----------
function renderSched() {
  const n = nowState();
  const di = selectedDay ?? Math.max(0, S.findIndex(d=>d.date===n.date));
  const day = S[di];
  let html = `<div class="days">${S.map((d,k)=>`<button class="${k===di?'on':''}" onclick="selectedDay=${k};renderSched()">${d.day}</button>`).join('')}</div>`;
  day.items.forEach(i => {
    const isToday = day.date===n.date, sm=toMin(i.s), em=toMin(i.e);
    const cls = isToday ? (n.min>=em ? 'past' : (n.min>=sm ? 'live' : '')) : '';
    const v = i.v ? V[i.v] : null;
    html += `<div class="item ${cls}"><div class="time">${i.s}<br>${i.e}</div><div style="flex:1">
      <div class="title">${i.t}</div>${i.sub?`<div class="sub">${i.sub}</div>`:''}
      <div class="sub">📍 ${v?v.name:i.place}${i.room?` · ${i.room}`:''}</div>
      ${v?`<button class="go" style="padding:5px 10px;font-size:12px" onclick="goTo('${i.v}')">여기로 가기 →</button>`:''}</div></div>`;
  });
  $('#sched').innerHTML = html;
}

// ---------- map ----------
const map = L.map('map', { zoomControl:false, attributionControl:false }).setView([20.9150,-156.6945], 17);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:20, maxNativeZoom:19 }).addTo(map);
const pins = {};
for (const [k,v] of Object.entries(V)) {
  pins[k] = L.marker([v.lat,v.lng], { icon: L.divIcon({ className:'', html:`<div class="pin" data-k="${k}">${v.name}</div>`, iconAnchor:[0,12] }) })
    .addTo(map).on('click', ()=>goTo(k));
}
let me = null, meCircle = null, line = null, target = null, watchId = null, pos = null, heading = null;

function startGps() {
  if (!navigator.geolocation) { $('#gpsbtn').textContent='GPS 미지원'; return; }
  $('#gpsbtn').textContent = '📡 검색 중…';
  watchId = navigator.geolocation.watchPosition(p => {
    pos = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy };
    if (p.coords.heading!=null && p.coords.speed>0.5) heading = p.coords.heading;
    const ll = [pos.lat,pos.lng];
    if (!me) {
      me = L.marker(ll, { icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[18,18], iconAnchor:[9,9]}), zIndexOffset:1000 }).addTo(map);
      meCircle = L.circle(ll, { radius:pos.acc, color:'#2f80ff', weight:1, fillOpacity:.1 }).addTo(map);
      map.setView(ll, 18);
    } else { me.setLatLng(ll); meCircle.setLatLng(ll).setRadius(pos.acc); }
    $('#gpsbtn').textContent = `📡 ±${Math.round(pos.acc)}m`;
    updateHud();
  }, e => { $('#gpsbtn').textContent = '📡 ' + (e.code===1?'권한 거부됨':'오류'); }, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
}
$('#gpsbtn').onclick = () => { if (pos) map.setView([pos.lat,pos.lng], 18); else startGps(); };

// 나침반 (iOS는 사용자 제스처 + 권한 필요)
$('#compassbtn').onclick = async () => {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      const r = await DeviceOrientationEvent.requestPermission(); if (r!=='granted') throw 0;
    }
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
    $('#compassbtn').textContent = '🧭 켜짐';
  } catch { $('#compassbtn').textContent = '🧭 권한 없음'; }
};
function onOrient(e) {
  let h = null;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;            // iOS
  else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;          // Android absolute
  if (h != null) { heading = h; updateHud(); }
}

function goTo(k) {
  target = k;
  Object.entries(pins).forEach(([kk,m]) => m.getElement()?.querySelector('.pin')?.classList.toggle('target', kk===k));
  document.querySelectorAll('.gpin').forEach(g => g.classList.toggle('target', g.dataset.k===k));
  showPanel('mapwrap');
  const v = V[k];
  if (pos) map.fitBounds([[pos.lat,pos.lng],[v.lat,v.lng]], { padding:[40,40], maxZoom:19 }); else map.setView([v.lat,v.lng], 18);
  updateHud();
}

function dist(a,b) { const R=6371000, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r, x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function bearing(a,b) { const r=Math.PI/180, y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r), x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r); return (Math.atan2(y,x)/r+360)%360; }
const dirName = b => ['북','북동','동','남동','남','남서','서','북서'][Math.round(b/45)%8];

function updateHud() {
  if (!target) return;
  const v = V[target];
  $('#hud-name').textContent = v.name + (v.estimated?' ★':'');
  if (!pos) { $('#hud-sub').textContent = 'GPS 위치 찾는 중…'; $('#dist').textContent='—'; return; }
  const d = dist(pos, v), b = bearing(pos, v);
  if (line) line.setLatLngs([[pos.lat,pos.lng],[v.lat,v.lng]]); else line = L.polyline([[pos.lat,pos.lng],[v.lat,v.lng]], { color:'#ffb703', weight:4, dashArray:'8 8' }).addTo(map);
  $('#dist').textContent = d<1000 ? `${Math.round(d)}m` : `${(d/1000).toFixed(1)}km`;
  const mins = Math.max(1, Math.round(d/70));
  $('#hud-sub').textContent = d < 25 ? `도착 · ${v.note}` : `${dirName(b)}쪽 · 도보 약 ${mins}분 · ${v.note}`;
  const rel = heading!=null ? b - heading : b;
  $('#arrow').style.transform = `rotate(${rel - 90}deg)`;
  $('#arrow').style.color = heading!=null ? 'var(--ok)' : 'var(--dim)';
}

// ---------- illustrated map ----------
const gb = $('#guidebox');
for (const [k,v] of Object.entries(V)) {
  const g = document.createElement('div'); g.className='gpin'; g.dataset.k=k; g.textContent=v.name;
  g.style.left = v.px[0]+'px'; g.style.top = v.px[1]+'px'; g.onclick = ()=>goTo(k); gb.appendChild(g);
}
function fitGuide() { const s = Math.max(0.35, Math.min(1, $('#guide').clientWidth/2126*1.6)); gb.style.transform=`scale(${s})`; gb.parentElement.style.height=''; }

// ---------- boot ----------
function tick() { const n=nowState(); $('#clock').firstChild.nodeValue = n.hhmm; }
tick(); renderNow(); renderSched();
setInterval(()=>{ tick(); renderNow(); if ($('#sched').classList.contains('on')) renderSched(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
